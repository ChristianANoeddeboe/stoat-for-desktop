<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <title>Stoat</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #191919;
        --surface: #242424;
        --border: #3a3a3a;
        --text: #f2f2f2;
        --muted: #a8a8a8;
        --accent: #7c8cff;
        --accent-text: #0e1030;
        --error: #ff8a80;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }

      main {
        width: 100%;
        max-width: 420px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        font-weight: 600;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: transparent;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      button {
        padding: 9px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-text);
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .error {
        margin: 12px 0 0;
        color: var(--error);
      }

      .note {
        margin: 20px 0 0;
        font-size: 13px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose a server</h1>
      <p>Enter the address of the Stoat server you want to use.</p>

      <form id="form">
        <label for="address">Server address</label>
        <input
          id="address"
          type="text"
          placeholder="stoat.example.com"
          autocomplete="url"
          spellcheck="false"
          autofocus
        />

        <p id="error" class="error" role="alert" hidden></p>

        <div class="actions">
          <button id="connect" class="primary" type="submit">Connect</button>
          <button id="retry" type="button" hidden>Try again</button>
          <button id="official" type="button">Use stoat.chat</button>
        </div>
      </form>

      <p id="forced" class="note" hidden>
        This app was started with <code>--force-server</code>, which overrides
        the server you pick here.
      </p>
    </main>

    <script>
      const form = document.getElementById("form");
      const address = document.getElementById("address");
      const error = document.getElementById("error");
      const buttons = document.querySelectorAll("button");
      const retry = document.getElementById("retry");
      let officialServer = "https://stoat.chat/app";

      function showError(message) {
        error.textContent = message ?? "";
        error.hidden = !message;
      }

      async function connect(value) {
        buttons.forEach((button) => (button.disabled = true));
        showError(null);

        const message = await window.serverPicker.setServer(value);
        if (message) {
          showError(message);
          buttons.forEach((button) => (button.disabled = false));
          address.focus();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        connect(address.value);
      });

      document
        .getElementById("official")
        .addEventListener("click", () => connect(officialServer));

      retry.addEventListener("click", () => {
        buttons.forEach((button) => (button.disabled = true));
        window.serverPicker.retry();
      });

      window.serverPicker.getState().then((state) => {
        officialServer = state.official;
        if (state.current) {
          const url = new URL(state.current);
          address.value =
            url.protocol === "https:" && url.pathname === "/"
              ? url.host
              : state.current;
        }

        retry.hidden = !(state.error && state.current);
        document.getElementById("forced").hidden = !state.forced;
        showError(state.error);
        address.select();
      });
    </script>
  </body>
</html>
